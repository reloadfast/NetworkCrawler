name: Docker — Build & Push

# Triggers:
#   • Push to main → build, push :latest + :sha-XXXXX, smoke test
#   • Pull request → build only (no push) for image validation
#
# Registry: forgejo.moseisley.es (Forgejo container registry)
# Secret required: FORGEJO_TOKEN — Forgejo PAT with package + repo scopes
#   Create at: Forgejo → Settings → Applications → Generate Token

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: forgejo.moseisley.es/wind/networkcrawler
  REGISTRY: forgejo.moseisley.es

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ env.REGISTRY }}"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Forgejo registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push sha tag
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          build-args: APP_VERSION=${{ steps.sha.outputs.short }}
          provenance: false

      # Create :latest as a manifest-only copy of the sha- image.
      # docker manifest create/push sends ONLY the manifest JSON — no layer blobs.
      # This completely bypasses the per-blob rate limiter.
      - name: Tag latest via docker manifest (no blobs)
        if: github.event_name != 'pull_request'
        run: |
          docker manifest create ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          docker manifest push ${{ env.IMAGE }}:latest

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          docker rm -f nc-ci 2>/dev/null || true
          docker run -d --name nc-ci \
            -e DATABASE_URL=sqlite:////tmp/test.db \
            -e NETWORK_INTERFACE=lo \
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          for i in $(seq 1 30); do
            docker exec nc-ci curl -sf http://localhost:8000/health \
              2>/dev/null && echo "Health OK" && break
            if [ "$i" -eq 30 ]; then
              docker logs nc-ci
              docker rm -f nc-ci
              exit 1
            fi
            sleep 1
          done
          docker rm -f nc-ci

      - name: Prune dangling images
        if: success()
        run: docker image prune -f
